name: Package plugins

# Реестра нет: расширение — это папка plugins/<id>/ с manifest.json.
# Приложение находит папки само (через GitHub API), а этот workflow только
# собирает для каждой архив compressed/<id>.tar.zst, чтобы расширение
# скачивалось одним запросом, и удаляет архивы удалённых папок.

on:
  push:
    branches:
      - main
    paths:
      - "plugins/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Package modified or new plugins
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            # Первый push или ручной запуск — пересобираем всё.
            changed_files=$(git ls-tree -r --name-only "$AFTER_SHA" -- plugins/)
          else
            changed_files=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- plugins/)
          fi

          mkdir -p compressed

          for archive in compressed/*.tar.zst; do
            [[ -e "$archive" ]] || continue
            plugin_name=$(basename "$archive" .tar.zst)
            if [[ ! -f "plugins/$plugin_name/manifest.json" ]]; then
              echo "Removing orphan $archive"
              rm -f "$archive"
            fi
          done

          plugin_names=$(printf '%s\n' "$changed_files" \
            | awk -F/ 'NF >= 3 && $1 == "plugins" { print $2 }' \
            | sort -u)

          while IFS= read -r plugin_name; do
            [[ -z "$plugin_name" ]] && continue
            if [[ -f "plugins/$plugin_name/manifest.json" ]]; then
              echo "Packaging plugins/$plugin_name..."
              # Содержимое папки без вложенного пути: manifest.json в корне архива.
              tar -I zstd -cf "compressed/${plugin_name}.tar.zst" -C "plugins/${plugin_name}" .
            fi
          done <<< "$plugin_names"

      - name: Commit generated archives
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain -- compressed/)" ]]; then
            echo "No archives to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A compressed/
          git commit -m "chore: package updated plugins [skip ci]"
          git push
